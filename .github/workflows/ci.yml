name: CI

on:
  push:
    branches: [main, "feat-*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            rust: stable
          - name: Linux
            os: ubuntu-latest
            rust: stable
          - name: Minimum Rust 1.88
            os: ubuntu-latest
            rust: 1.88.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify release metadata and tooling
        run: |
          python3 scripts/version.py check
          python3 -m unittest discover -s scripts -p 'test_*.py'
          bash -n scripts/headatever.sh scripts/build-release.sh
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Verify compiled version
        run: python3 scripts/version.py check --binary target/release/stt-cli
