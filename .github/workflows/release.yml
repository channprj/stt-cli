name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (defaults to v<VERSION>)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build-assets:
    runs-on: macos-15
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      revision: ${{ steps.meta.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Resolve and check out the existing release tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            TAG="${INPUT_TAG:-v$(tr -d '[:space:]' < VERSION)}"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          [[ "$TAG" == v* ]] || { echo "Release tags must start with v" >&2; exit 1; }
          python3 scripts/version.py validate "${TAG#v}"
          REVISION="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          git checkout --detach "$REVISION"
          python3 scripts/version.py check --tag "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Validate release source
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build and verify universal binary
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: scripts/build-release.sh "$TAG"
      - name: Stage verified assets for the publication job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: target/release-assets/
          if-no-files-found: error
          retention-days: 7

  security:
    needs: build-assets
    uses: ./.github/workflows/security.yml
    with:
      ref: ${{ needs.build-assets.outputs.revision }}

  publish-release:
    needs: [build-assets, security]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: target/release-assets
      - name: Publish release assets without replacing existing downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build-assets.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          (cd target/release-assets && sha256sum --check SHA256SUMS)
          ASSETS=(target/release-assets/stt-cli-macos-universal target/release-assets/SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}"
          else
            gh release create "$TAG" "${ASSETS[@]}" --verify-tag --title "$TAG" --generate-notes
          fi

  sync-homebrew:
    needs: [build-assets, publish-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build-assets.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Checkout Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: channprj/homebrew-tap
          token: ${{ secrets.HOMBREW_TAP_REPO_TOKEN }}
          ref: main
          path: tap-repo
          persist-credentials: false
      - name: Pin the formula to this release
        env:
          TAG: ${{ needs.build-assets.outputs.tag }}
          REVISION: ${{ needs.build-assets.outputs.revision }}
        run: >-
          python3 scripts/homebrew.py --tag "$TAG" --revision "$REVISION"
          --output tap-repo/Formula/stt-cli.rb
      - name: Commit and push the formula
        working-directory: tap-repo
        env:
          TAG: ${{ needs.build-assets.outputs.tag }}
          GH_TOKEN: ${{ secrets.HOMBREW_TAP_REPO_TOKEN }}
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- Formula/stt-cli.rb; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/stt-cli.rb
          git commit -m "chore(tap): sync stt-cli formula for $TAG"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:main
