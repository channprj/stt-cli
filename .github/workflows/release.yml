name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (defaults to v<VERSION>)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: macos-15
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      revision: ${{ steps.meta.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve and check out the existing release tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            TAG="${INPUT_TAG:-v$(tr -d '[:space:]' < VERSION)}"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          [[ "$TAG" == v* ]] || { echo "Release tags must start with v" >&2; exit 1; }
          python3 scripts/version.py validate "${TAG#v}"
          REVISION="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          git checkout --detach "$REVISION"
          python3 scripts/version.py check --tag "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Validate release source
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build and verify universal binary
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: scripts/build-release.sh "$TAG"
      - name: Publish release assets without replacing existing downloads
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          ASSETS=(target/release-assets/stt-cli-macos-universal target/release-assets/SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}"
          else
            gh release create "$TAG" "${ASSETS[@]}" --verify-tag --title "$TAG" --generate-notes
          fi

  sync-homebrew:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-and-release.outputs.revision }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: channprj/homebrew-tap
          token: ${{ secrets.HOMBREW_TAP_REPO_TOKEN }}
          ref: main
          path: tap-repo
      - name: Pin the formula to this release
        env:
          TAG: ${{ needs.build-and-release.outputs.tag }}
          REVISION: ${{ needs.build-and-release.outputs.revision }}
        run: >-
          python3 scripts/homebrew.py --tag "$TAG" --revision "$REVISION"
          --output tap-repo/Formula/stt-cli.rb
      - name: Commit and push the formula
        working-directory: tap-repo
        env:
          TAG: ${{ needs.build-and-release.outputs.tag }}
        run: |
          git diff --check
          if git diff --quiet -- Formula/stt-cli.rb; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/stt-cli.rb
          git commit -m "chore(tap): sync stt-cli formula for $TAG"
          git push origin HEAD:main
