[package]
name = "stt-cli"
version = "1.260906.0"
edition = "2024"
rust-version = "1.88"
description = "Transcribe audio files and stamp each line with the wall-clock time it was spoken"
repository = "https://github.com/channprj/stt-cli"
readme = "README.md"
categories = ["command-line-utilities"]
keywords = ["transcription", "speech-to-text", "whisper", "timestamps"]

[dependencies]
anstream = "1.0"
anstyle = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive", "wrap_help"] }
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "multipart",
    "rustls-tls",
] }
rpassword = "7.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"

[profile.release]
strip = true
