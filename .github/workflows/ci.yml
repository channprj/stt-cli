name: CI

on:
  push:
    branches: [main, "feat-*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (primary)
            os: macos-latest
          - name: Linux
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build --release

      - name: Verify --version matches the VERSION file
        shell: bash
        run: |
          set -euo pipefail
          expected="$(tr -d '[:space:]' < VERSION)"
          actual="$(./target/release/stt-cli --version | awk '{print $NF}')"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "error: --version reports ${actual}, VERSION says ${expected}" >&2
            exit 1
          fi
          echo "stt-cli ${actual}"
