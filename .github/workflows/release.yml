# Adapted from channprj/kmsg/.github/workflows/release.yml
# Builds a universal macOS binary, creates a GitHub release, and syncs the
# Homebrew tap formula at channprj/homebrew-tap.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.260815.0). Optional."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    env:
      RELEASE_ASSET_NAME: stt-cli-macos-universal
      TAP_REPO: channprj/homebrew-tap
      TAP_REPO_REF: main

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          TAG=""
          SOURCE=""

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            INPUT_TAG='${{ inputs.tag }}'
            INPUT_TAG="$(printf '%s' "$INPUT_TAG" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

            if [[ -n "$INPUT_TAG" ]]; then
              TAG="$INPUT_TAG"
              SOURCE="dispatch_input"
            else
              RAW_VERSION="$(cat VERSION | tr -d '[:space:]')"
              if [[ -z "$RAW_VERSION" ]]; then
                echo "Unable to resolve release tag from VERSION file"
                exit 1
              fi
              TAG="v$RAW_VERSION"
              SOURCE="version_file_fallback"
            fi
          else
            TAG="${GITHUB_REF_NAME}"
            SOURCE="push_ref"
          fi

          if [[ -z "$TAG" ]]; then
            echo "Unable to resolve release tag"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG (source: $SOURCE)"

      - name: Check out release tag for dispatch input
        if: steps.meta.outputs.source == 'dispatch_input'
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            git checkout --force --detach "refs/tags/$TAG"
            echo "Building from tag $TAG ($(git rev-parse --short HEAD))"
          else
            echo "::warning::Tag $TAG does not exist locally; building from the current ref."
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build universal binary
        shell: bash
        run: |
          set -euo pipefail

          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

          ARM_BIN="target/aarch64-apple-darwin/release/stt-cli"
          X86_BIN="target/x86_64-apple-darwin/release/stt-cli"

          test -f "$ARM_BIN"
          test -f "$X86_BIN"

          lipo -create -output "$RELEASE_ASSET_NAME" "$ARM_BIN" "$X86_BIN"
          chmod +x "$RELEASE_ASSET_NAME"
          file "$RELEASE_ASSET_NAME"
          lipo -info "$RELEASE_ASSET_NAME"

      - name: Verify binary version matches release tag
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail

          EXPECTED="${TAG#v}"
          ACTUAL="$(./"$RELEASE_ASSET_NAME" --version | tr -d '[:space:]')"

          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::Built binary version '$ACTUAL' does not match release tag '$TAG' (expected '$EXPECTED')."
            exit 1
          fi
          echo "Binary version matches release tag: $ACTUAL"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$RELEASE_ASSET_NAME" --clobber
          else
            gh release create "$TAG" "$RELEASE_ASSET_NAME" --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          fi

      - name: Checkout tap repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TAP_REPO }}
          token: ${{ secrets.HOMBREW_TAP_REPO_TOKEN }}
          ref: ${{ env.TAP_REPO_REF }}
          path: tap-repo

      - name: Update Homebrew formula
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"
          SHA256="$(shasum -a 256 "$RELEASE_ASSET_NAME" | cut -d' ' -f1)"

          TAP_DIR="$GITHUB_WORKSPACE/tap-repo"
          FORMULA="$TAP_DIR/Formula/stt-cli.rb"

          tee "$FORMULA" > /dev/null <<RUBY
          class SttCli < Formula
            desc "Transcribe audio and stamp each line with the time it was spoken"
            homepage "https://github.com/channprj/stt-cli"
            url "https://github.com/channprj/stt-cli/releases/download/${TAG}/${RELEASE_ASSET_NAME}"
            sha256 "${SHA256}"
            version "${VERSION}"
            license "MIT"

            head "https://github.com/channprj/stt-cli.git", branch: "main" do
              depends_on "rust" => :build
            end

            on_macos do
              depends_on "rust" => :build if build.head?
            end

            def install
              if build.head?
                system "cargo", "install", *std_cargo_args
              else
                bin.install "${RELEASE_ASSET_NAME}" => "stt-cli"
              end
            end

            test do
              assert_match "${VERSION}", shell_output("#{bin}/stt-cli --version")
              assert_match "stt-cli/api.json", shell_output("#{bin}/stt-cli config path")
            end
          end
          RUBY

          cd "$TAP_DIR"
          if git diff --quiet -- Formula; then
            echo "Homebrew tap already up-to-date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/stt-cli.rb
          git commit -m "chore(tap): sync stt-cli formula for ${TAG}"
          git push origin HEAD:"$TAP_REPO_REF"